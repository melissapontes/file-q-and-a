<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>

  <!-- Faixa 1: indexação -->
  <rect x="20" y="20" width="1160" height="170" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="40" y="48" font-size="17" font-weight="bold" fill="#1e293b">A. Indexação (feita uma vez, a cada novo documento)</text>

  <g font-size="15" text-anchor="middle" fill="#0f172a">
    <rect x="40" y="75" width="220" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="150" y="112" font-weight="bold">Documentos de referência</text>
    <text x="150" y="134" font-size="13" fill="#475569">PDF, DOCX, XLSX, TXT</text>

    <rect x="320" y="75" width="220" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="430" y="112" font-weight="bold">Segmentação em trechos</text>
    <text x="430" y="134" font-size="13" fill="#475569">~1.800 caracteres, com página</text>

    <rect x="600" y="75" width="220" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="710" y="112" font-weight="bold">Vetorização (embeddings)</text>
    <text x="710" y="134" font-size="13" fill="#475569">gemini-embedding-001, 768 dim.</text>

    <rect x="880" y="75" width="280" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1020" y="112" font-weight="bold">Banco PostgreSQL + pgvector</text>
    <text x="1020" y="134" font-size="13" fill="#475569">vetores (HNSW) + texto completo</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="260" y1="120" x2="318" y2="120"/>
    <line x1="540" y1="120" x2="598" y2="120"/>
    <line x1="820" y1="120" x2="878" y2="120"/>
  </g>

  <!-- Faixa 2: consulta -->
  <rect x="20" y="230" width="1160" height="350" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="258" font-size="17" font-weight="bold" fill="#1e293b">B. Consulta (a cada pergunta)</text>

  <g font-size="15" text-anchor="middle" fill="#0f172a">
    <rect x="40" y="300" width="180" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="130" y="336" font-weight="bold">Pergunta do</text>
    <text x="130" y="356" font-weight="bold">usuário</text>
    <text x="130" y="378" font-size="13" fill="#475569">vira vetor (embedding)</text>

    <rect x="275" y="300" width="230" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="390" y="330" font-weight="bold">Busca híbrida</text>
    <text x="390" y="351" font-size="13" fill="#475569">semântica (pgvector) + texto</text>
    <text x="390" y="369" font-size="13" fill="#475569">completo, fusão RRF, filtro</text>
    <text x="390" y="387" font-size="13" fill="#475569">por espécie</text>

    <rect x="560" y="300" width="180" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="650" y="336" font-weight="bold">Trechos mais</text>
    <text x="650" y="356" font-weight="bold">relevantes</text>
    <text x="650" y="378" font-size="13" fill="#475569">os 8 melhores</text>

    <rect x="795" y="300" width="180" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="885" y="336" font-weight="bold">Modelo Gemini</text>
    <text x="885" y="358" font-size="13" fill="#475569">responde só com base</text>
    <text x="885" y="376" font-size="13" fill="#475569">nos trechos recebidos</text>

    <rect x="1030" y="300" width="130" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1095" y="336" font-weight="bold">Resposta</text>
    <text x="1095" y="358" font-size="13" fill="#475569">com fontes citadas</text>
    <text x="1095" y="376" font-size="13" fill="#475569">ou recusa</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="220" y1="345" x2="273" y2="345"/>
    <line x1="505" y1="345" x2="558" y2="345"/>
    <line x1="740" y1="345" x2="793" y2="345"/>
    <line x1="975" y1="345" x2="1028" y2="345"/>
  </g>

  <!-- Banco -> busca -->
  <path d="M1020,165 L1020,215 L390,215 L390,298" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
  <text x="705" y="209" font-size="13" text-anchor="middle" fill="#15803d" font-style="italic">consulta aos trechos indexados</text>

  <!-- Nota de recusa -->
  <rect x="275" y="440" width="885" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <g font-size="14" fill="#334155">
    <text x="295" y="470" font-weight="bold">Controles de qualidade</text>
    <text x="295" y="494">• O modelo recebe apenas os trechos recuperados, sem consultar conhecimento externo.</text>
    <text x="295" y="514">• Cada citação é validada contra os trechos reais; citações sem correspondência são removidas.</text>
    <text x="295" y="534">• Se a informação não consta na base, o sistema informa que não encontrou, em vez de inventar.</text>
  </g>
</svg>
