<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <radialGradient id="glow1" cx="30%" cy="20%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="80%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2847;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bgGradient)"/>
  
  <!-- Glow effects -->
  <circle cx="420" cy="180" r="350" fill="url(#glow1)"/>
  <circle cx="980" cy="720" r="350" fill="url(#glow2)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="0" x2="1400" y2="900"/>
    <line x1="1400" y1="0" x2="0" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
    <line x1="0" y1="450" x2="1400" y2="450"/>
  </g>
  
  <!-- AI text -->
  <text x="200" y="150" font-size="80" font-weight="bold" fill="#ff006e" opacity="0.3" font-family="Arial">AI</text>
  
  <!-- Kidney shape (simplified) -->
  <g transform="translate(800, 350)">
    <!-- Kidney silhouette -->
    <ellipse cx="0" cy="0" rx="180" ry="250" fill="#ff006e" opacity="0.15"/>
    
    <!-- Inner glow -->
    <ellipse cx="0" cy="0" rx="160" ry="220" fill="#ff006e" opacity="0.25" filter="url(#blur)"/>
    
    <!-- Circuit nodes -->
    <circle cx="-80" cy="-120" r="25" fill="#00d4ff" opacity="0.8"/>
    <circle cx="60" cy="-100" r="20" fill="#00d4ff" opacity="0.7"/>
    <circle cx="-100" cy="50" r="22" fill="#00d4ff" opacity="0.75"/>
    <circle cx="90" cy="80" r="18" fill="#00d4ff" opacity="0.7"/>
    <circle cx="0" cy="150" r="20" fill="#00d4ff" opacity="0.8"/>
    
    <!-- Circuit lines -->
    <line x1="-80" y1="-120" x2="60" y2="-100" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
    <line x1="60" y1="-100" x2="90" y2="80" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
    <line x1="-100" y1="50" x2="90" y2="80" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="150" x2="-100" y2="50" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="150" x2="90" y2="80" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Robot hand (simplified) -->
  <g transform="translate(200, 400)" opacity="0.4">
    <rect x="0" y="0" width="80" height="20" rx="10" fill="#ff006e"/>
    <circle cx="15" cy="-15" r="12" fill="#ff006e"/>
    <circle cx="40" cy="-18" r="10" fill="#ff006e"/>
    <circle cx="65" cy="-16" r="11" fill="#ff006e"/>
  </g>
  
  <!-- Floating particles -->
  <circle cx="400" cy="200" r="4" fill="#00d4ff" opacity="0.6"/>
  <circle cx="600" cy="300" r="3" fill="#00d4ff" opacity="0.5"/>
  <circle cx="1000" cy="250" r="3" fill="#ff006e" opacity="0.5"/>
  <circle cx="1200" cy="400" r="4" fill="#00d4ff" opacity="0.6"/>
  <circle cx="300" cy="600" r="3" fill="#ff006e" opacity="0.5"/>
  <circle cx="1100" cy="650" r="4" fill="#00d4ff" opacity="0.6"/>
</svg>